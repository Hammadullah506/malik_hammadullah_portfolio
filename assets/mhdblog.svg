<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg-mhdblog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07091c" />
      <stop offset="50%" stop-color="#121133" />
      <stop offset="100%" stop-color="#04030d" />
    </linearGradient>

    <!-- Indigo & Cyan Glow -->
    <linearGradient id="grad-indigo-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="grad-cyan-bright" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="blog-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intense-blog-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-mhdblog)" />

  <!-- Abstract Bento Grid Wireframes in Background -->
  <g opacity="0.18">
    <rect x="70" y="50" width="280" height="150" rx="12" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 6" />
    <rect x="370" y="50" width="360" height="90" rx="12" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 6" />
    <rect x="370" y="160" width="170" height="90" rx="12" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 6" />
    <rect x="560" y="160" width="170" height="90" rx="12" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 6" />
  </g>

  <!-- Constellation Nodes & Connecting Fibers -->
  <g opacity="0.6">
    <circle cx="150" cy="180" r="4" fill="#06b6d4" filter="url(#blog-glow)" />
    <circle cx="250" cy="110" r="4" fill="#6366f1" filter="url(#blog-glow)" />
    <circle cx="650" cy="110" r="4" fill="#38bdf8" filter="url(#blog-glow)" />
    <circle cx="550" cy="190" r="4" fill="#8b5cf6" filter="url(#blog-glow)" />
    <line x1="150" y1="180" x2="250" y2="110" stroke="#06b6d4" stroke-width="1.5" />
    <line x1="250" y1="110" x2="330" y2="170" stroke="#6366f1" stroke-width="1.5" />
    <line x1="650" y1="110" x2="550" y2="190" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="550" y1="190" x2="470" y2="170" stroke="#8b5cf6" stroke-width="1.5" />
  </g>

  <!-- Central Holographic Orbital Rings -->
  <circle cx="400" cy="190" r="110" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="12 8" opacity="0.6" filter="url(#blog-glow)" />
  <circle cx="400" cy="190" r="85" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.8" />
  <circle cx="400" cy="190" r="62" fill="rgba(99, 102, 241, 0.08)" stroke="#8b5cf6" stroke-width="2" filter="url(#blog-glow)" />

  <!-- Center Symbol: Bento Layout & Newspaper / Code Insights Icon -->
  <g transform="translate(400, 185) scale(1.15)" filter="url(#intense-blog-glow)">
    <!-- Bento Stack Silhouette -->
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="none" stroke="url(#grad-indigo-cyan)" stroke-width="2.5" />
    <!-- Horizontal Article Lines -->
    <line x1="-16" y1="-12" x2="6" y2="-12" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-16" y1="-2" x2="16" y2="-2" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="-16" y1="7" x2="12" y2="7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="-16" y1="15" x2="0" y2="15" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
    <!-- Pulse Corner Dot -->
    <circle cx="16" cy="-14" r="3" fill="#00ffcc" />
  </g>

  <!-- High-Tech Feature Badges -->
  <g font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">
    <!-- Badge 1: 95+ Mobile PageSpeed -->
    <rect x="95" y="260" width="170" height="32" rx="16" fill="rgba(6, 182, 212, 0.12)" stroke="#06b6d4" stroke-width="1.2" />
    <text x="180" y="281" fill="#06b6d4" text-anchor="middle">⚡ 95+ PAGESPEED</text>

    <!-- Badge 2: Bento Grid UI -->
    <rect x="535" y="260" width="170" height="32" rx="16" fill="rgba(139, 92, 246, 0.12)" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="620" y="281" fill="#8b5cf6" text-anchor="middle">✦ BENTO UI SYSTEM</text>
  </g>

  <!-- Title & Subtitle Banner -->
  <text x="400" y="358" font-family="'Orbitron', sans-serif" font-size="23" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#blog-glow)">
    MHD TECH BLOG &amp; INSIGHTS
  </text>
  <text x="400" y="390" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#8b5cf6" text-anchor="middle" letter-spacing="3">
    WEB ARCHITECTURE &amp; DIGITAL PUBLICATION
  </text>
</svg>
