<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg-mhdagency" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040817" />
      <stop offset="50%" stop-color="#0c1735" />
      <stop offset="100%" stop-color="#03050e" />
    </linearGradient>

    <!-- Neon Cyan & Electric Blue -->
    <linearGradient id="grad-cyan-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="grad-gold-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="grad-cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00ffcc" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="agency-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intense-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-mhdagency)" />

  <!-- Cosmic Grid Overlay -->
  <g opacity="0.2">
    <line x1="80" y1="50" x2="720" y2="50" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6" />
    <line x1="80" y1="400" x2="720" y2="400" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6" />
    <line x1="80" y1="50" x2="80" y2="400" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6" />
    <line x1="720" y1="50" x2="720" y2="400" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6" />
    <line x1="400" y1="50" x2="400" y2="400" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- Constellation Nodes & Digital Lines -->
  <g opacity="0.55">
    <circle cx="160" cy="130" r="4" fill="#38bdf8" filter="url(#agency-glow)" />
    <circle cx="230" cy="210" r="5" fill="#f59e0b" filter="url(#agency-glow)" />
    <circle cx="640" cy="130" r="4" fill="#00ffcc" filter="url(#agency-glow)" />
    <circle cx="570" cy="210" r="5" fill="#38bdf8" filter="url(#agency-glow)" />
    <line x1="160" y1="130" x2="230" y2="210" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="230" y1="210" x2="310" y2="200" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="640" y1="130" x2="570" y2="210" stroke="#00ffcc" stroke-width="1.5" />
    <line x1="570" y1="210" x2="490" y2="200" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Central Holographic Orbital Rings -->
  <circle cx="400" cy="195" r="115" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="14 8" opacity="0.6" filter="url(#agency-glow)" />
  <circle cx="400" cy="195" r="90" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.75" />
  <circle cx="400" cy="195" r="65" fill="rgba(56, 189, 248, 0.06)" stroke="#00ffcc" stroke-width="2" filter="url(#agency-glow)" />

  <!-- Center Symbol: Enterprise Crown & Shield Crest -->
  <g transform="translate(400, 190) scale(1.15)" filter="url(#intense-glow)">
    <!-- Shield / Core Base -->
    <path d="M 0 -36 L 28 -20 L 28 8 C 28 26 0 38 0 38 C 0 38 -28 26 -28 8 L -28 -20 Z" 
          fill="none" stroke="url(#grad-cyan-gold)" stroke-width="3" />
    <!-- Inner Emblem M & H -->
    <path d="M -15 16 L -15 -12 L 0 0 L 15 -12 L 15 16" 
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="0" cy="-22" r="3" fill="#f59e0b" />
  </g>

  <!-- High-Tech Feature Floating Badges -->
  <g font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">
    <!-- Badge 1: Enterprise Web Agency -->
    <rect x="100" y="260" width="165" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="182" y="281" fill="#38bdf8" text-anchor="middle">★ ENTERPRISE AGENCY</text>

    <!-- Badge 2: Sub-Second TTFB -->
    <rect x="535" y="260" width="165" height="32" rx="16" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1.2" />
    <text x="617" y="281" fill="#f59e0b" text-anchor="middle">⚡ SUB-SECOND SPEED</text>
  </g>

  <!-- Title & Subtitle Banner -->
  <text x="400" y="358" font-family="'Orbitron', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#agency-glow)">
    MALIK HAMMAD DIGITAL
  </text>
  <text x="400" y="390" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="3">
    ENTERPRISE WEB SOLUTIONS &amp; ARCHITECTURE
  </text>
</svg>
