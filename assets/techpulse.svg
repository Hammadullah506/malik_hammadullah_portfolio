<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg-techpulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="50%" stop-color="#0a1a36" />
      <stop offset="100%" stop-color="#02050c" />
    </linearGradient>

    <!-- Vibrant Cyan / Emerald Neon -->
    <linearGradient id="grad-pulse-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="grad-cyan-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="pulse-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intense-pulse-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-techpulse)" />

  <!-- Geometric Pulse Waves Overlay -->
  <g opacity="0.22">
    <path d="M 50 220 L 220 220 L 250 160 L 280 270 L 310 190 L 330 220 L 470 220 L 490 180 L 520 260 L 550 170 L 580 220 L 750 220" 
          fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="8 6" />
    <circle cx="280" cy="270" r="4" fill="#10b981" />
    <circle cx="520" cy="260" r="4" fill="#00f2fe" />
  </g>

  <!-- Constellation Nodes & Digital Lines -->
  <g opacity="0.6">
    <circle cx="160" cy="140" r="4" fill="#00f2fe" filter="url(#pulse-glow)" />
    <circle cx="240" cy="200" r="5" fill="#10b981" filter="url(#pulse-glow)" />
    <circle cx="640" cy="140" r="4" fill="#10b981" filter="url(#pulse-glow)" />
    <circle cx="560" cy="200" r="5" fill="#00f2fe" filter="url(#pulse-glow)" />
    <line x1="160" y1="140" x2="240" y2="200" stroke="#00f2fe" stroke-width="1.5" />
    <line x1="240" y1="200" x2="320" y2="190" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="640" y1="140" x2="560" y2="200" stroke="#10b981" stroke-width="1.5" />
    <line x1="560" y1="200" x2="480" y2="190" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Central Holographic Orbital Rings -->
  <circle cx="400" cy="190" r="110" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="14 8" opacity="0.6" filter="url(#pulse-glow)" />
  <circle cx="400" cy="190" r="85" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.8" />
  <circle cx="400" cy="190" r="62" fill="rgba(0, 242, 254, 0.08)" stroke="#fbbf24" stroke-width="2" filter="url(#pulse-glow)" />

  <!-- Center Symbol: Smartwatch & Shopping Bag / Gadget Pulse -->
  <g transform="translate(400, 185) scale(1.15)" filter="url(#intense-pulse-glow)">
    <!-- Smart Gadget / Watch Bezel -->
    <rect x="-18" y="-22" width="36" height="44" rx="10" fill="none" stroke="url(#grad-pulse-emerald)" stroke-width="2.8" />
    <!-- Straps -->
    <path d="M -10 -22 L -10 -32 L 10 -32 L 10 -22" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.7" />
    <path d="M -10 22 L -10 32 L 10 32 L 10 22" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.7" />
    <!-- ECG / Tech Pulse Line Inside Screen -->
    <path d="M -12 0 L -5 0 L -2 -8 L 3 9 L 7 -4 L 12 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="0" cy="-14" r="2" fill="#fbbf24" />
  </g>

  <!-- High-Tech Feature Floating Badges -->
  <g font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">
    <!-- Badge 1: COD Nationwide -->
    <rect x="100" y="260" width="165" height="32" rx="16" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1.2" />
    <text x="182" y="281" fill="#10b981" text-anchor="middle">★ COD NATIONWIDE</text>

    <!-- Badge 2: Smart Gadgets -->
    <rect x="535" y="260" width="165" height="32" rx="16" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1.2" />
    <text x="617" y="281" fill="#00f2fe" text-anchor="middle">⚡ SMART TECH STORE</text>
  </g>

  <!-- Title & Subtitle Banner -->
  <text x="400" y="358" font-family="'Orbitron', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#pulse-glow)">
    TECHPULSE PRIME
  </text>
  <text x="400" y="390" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#10b981" text-anchor="middle" letter-spacing="3">
    PREMIUM SMART TECH &amp; GADGETS STORE
  </text>
</svg>
